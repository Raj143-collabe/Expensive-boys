<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for clean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header / Welcome Dashboard -->
        <header class="header">
            <h1>Daily Expense Tracker</h1>
            <p>Monitor your daily spending, organize by category, and stay on top of your budget.</p>
        </header>

        <!-- Dashboard Summary Cards -->
        <section class="summary-cards">
            <div class="card total-card">
                <h3>Total Expenditure</h3>
                <p id="total-amount">₹0.00</p>
            </div>
            <div class="card count-card">
                <h3>Total Expenses</h3>
                <p id="total-count">0</p>
            </div>
        </section>

        <div class="main-content-grid">
            <!-- Left Column: Add Expense Form -->
            <section class="form-section">
                <h2>Add New Expense</h2>
                <form id="expense-form">
                    <div class="form-group">
                        <label for="expense-name">Expense Name</label>
                        <input type="text" id="expense-name" placeholder="e.g., Lunch, Bus Ticket" required>
                    </div>

                    <div class="form-group">
                        <label for="expense-category">Category</label>
                        <select id="expense-category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Bills">Bills</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expense-amount">Amount (₹)</label>
                        <input type="number" id="expense-amount" placeholder="e.g., 150" min="1" step="any" required>
                    </div>

                    <div class="form-group">
                        <label for="expense-date">Date</label>
                        <input type="date" id="expense-date" required>
                    </div>

                    <div class="form-group">
                        <label for="expense-desc">Description (Optional)</label>
                        <textarea id="expense-desc" placeholder="Add extra details..." rows="2"></textarea>
                    </div>

                    <div id="error-message" class="error-message"></div>

                    <button type="submit" class="btn-primary">Add Expense</button>
                </form>
            </section>

            <!-- Right Column: Expense List & Category Summary -->
            <section class="data-section">
                <!-- Category Summary Breakdown -->
                <div class="category-summary-container">
                    <h2>Category Summary</h2>
                    <div id="category-summary-grid" class="category-summary-grid">
                        <!-- Dynamically filled via JavaScript -->
                    </div>
                </div>

                <!-- Expense List / Table -->
                <div class="expense-list-container">
                    <div class="list-header">
                        <h2>Expense Records</h2>
                        <div class="filter-group">
                            <label for="filter-category">Filter:</label>
                            <select id="filter-category">
                                <option value="All">All Categories</option>
                                <option value="Food">Food</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Education">Education</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Bills">Bills</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table id="expense-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Expense</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="expense-table-body">
                                <!-- Dynamically populated rows -->
                            </tbody>
                        </table>
                    </div>
                    <div id="no-expenses" class="no-expenses hidden">No expenses recorded yet.</div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
